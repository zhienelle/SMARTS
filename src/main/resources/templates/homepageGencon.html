<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Gencon Homepage</title>
    <link rel='stylesheet' href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;700&family=Baloo+Chettan+2:wght@400;700&family=Numans&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Numans", sans-serif;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #EDEDED;
            color: #124D54;
            font-size: 14px;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
            z-index: 10;
            transition: all 0.5s ease;
            padding: 10px 20px;
        }

        header div {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header div i {
            font-size: 30px;
            color: #124D54;
        }

        header div p {
            margin: 0;
            font-size: 16px;
            font-weight: bold;
            color: #124D54;
        }

        header div p span {
            font-weight: bold;
            color: #F9744B;
        }

        header::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background-color: #F9744B;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #EDEDED;
            color: #124D54;
            font-size: 14px;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
            z-index: 10;
            transition: all 0.5s ease;
            padding-left: 20px;
            padding-right: 20px;
        }

        footer p {
            margin: 0;
            font-size: 14px;
            font-family: 'Numans', sans-serif;
            width: 100%;
            display: flex;
            justify-content: space-between;
        }

        footer p span {
            display: inline-block;
        }

        .smarts-logo img {
            height: 25px;
        }

        .home-section {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #EDEDED;
            text-align: center;
            background-image: url('https://i.postimg.cc/SRM5qzhm/bg-homepage.jpg');
            background-size: cover;
            background-position: center;
            transition: left 0.3s ease;
            opacity: 0.9;
            padding-top: 60px;
        }

        .home-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            margin: 0;
            background: #1A1A2E;
            color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            padding: 10px;
        }

        .container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            width: 90%;
            max-width: 1200px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .left-container,
        .right-container {
            width: 48%;
            padding: 20px;
            background: #FFF;
            border-radius: 20px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            border: 5px solid #F9744B;
        }

        .project-details {
            display: flex;
            justify-content: space-between;
            gap: 50px;
            margin-bottom: 20px;
            align-items: flex-start;
            text-align: justify;
            text-transform: uppercase;
        }

        .project-details div {
            width: 48%;
        }

        .project-details h2 {
            font-family: 'Fredoka', sans-serif;
            font-size: 16px;
            color: #124D54;
            margin: 0;
        }

        .project-details p {
            font-family: 'Nunito', sans-serif;
            font-size: 14px;
            margin: 5px 0;
            color: black;
        }

        .b {
            text-align: right;
        }

        .table-container {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: center;
            padding: 12px;
            border: 1px solid #DDD;
            font-size: 14px;
        }

        th {
            background-color: #FF6F61;
            color: #FFF;
        }

        td {
            background-color: #FFE0DC;
            color: #333;
        }

        .logout {
            margin-top: 20px;
            display: inline-block;
            padding: 10px 20px;
            background-color: #FF6F61;
            color: #FFF;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        .logout:hover {
            background-color: #E05B50;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            padding-bottom: 70px;
        }

        .buttons button {
            box-sizing: border-box;
            width: 199px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px 16px;
            background: linear-gradient(180deg, #124d54 0%, rgb(16, 41, 55) 100%);
            color: white;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            text-transform: uppercase;
            overflow: hidden;
            font-family: 'Fredoka', sans-serif;
            font-weight: bold;
            font-size: 20px;
        }

        .buttons button:hover {
            background: linear-gradient(180deg, #16a085 0%, rgb(22, 60, 77) 100%);
        }

        a {
            text-decoration: none;
        }

        .progress-card {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            background: #124D54;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .progress-report {
            color: #FF6F61;
            margin-bottom: 20px;
            text-align: center;
            font-size: 30px;
            font-family: 'Fredoka', sans-serif;
        }

        .legend {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            gap: 10px;
            font-size: 12px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-color {
            width: 15px;
            height: 15px;
            border-radius: 3px;
        }

        .task-1-color {
            background-color: #ee6842;
        }

        .task-2-color {
            background-color: #000000;
        }

        .task-3-color {
            background-color: #132c39;
        }

        .task-4-color {
            background-color: #a6a6a6;
        }

        .task-5-color {
            background-color: #f5a88d;
        }

        .progress-bar-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .stage {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 25px;
            height: 25px;
            border: 2px solid #FF6F61;
            border-radius: 4px;
            background-color: #FFF;
            flex-shrink: 0;
        }

        .checkbox.checked {
            background-color: #FF6F61;
            color: #FFF;
            font-size: 16px;
        }

        .stage-label {
            flex-shrink: 0;
            min-width: 60px;
            text-align: left;
            color: #FFB199;
            font-size: 14px;
        }

        .progress-bar {
            flex-grow: 1;
            height: 25px;
            background: #E0E0E0;
            border-radius: 5px;
            display: flex;
            overflow: hidden;
        }

        .progress-segment {
            height: 100%;
        }

        .task-1 {
            background-color: #ee6842;
            width: 20%;
        }

        .task-2 {
            background-color: #000000;
            width: 20%;
        }

        .task-3 {
            background-color: #132c39;
            width: 20%;
        }

        .task-4 {
            background-color: #a6a6a6;
            width: 20%;
        }

        .task-5 {
            background-color: #f5a88d;
            width: 20%;
        }

        .progress-axis {
            margin-top: 10px;
            display: flex;
            color: #EDEDED;
            font-size: 16px;
            justify-content: center;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .progress-card {
                padding: 15px;
            }

            h2 {
                font-size: 20px;
            }

            .legend {
                font-size: 10px;
                gap: 5px;
            }

            .checkbox {
                width: 20px;
                height: 20px;
            }

            .stage-label {
                font-size: 12px;
            }

            .progress-bar {
                height: 20px;
            }

            .progress-axis {
                font-size: 14px;
            }
        }
        .progress-segment {
            height: 10px;
            width: 20px;
            margin: 2px;
            display: inline-block;
            background-color: #ccc;
            border-radius: 4px;
        }
        .task-1 { background-color: #F9744B; }
        .task-2 { background-color: #FFC107; }
        .task-3 { background-color: #4CAF50; }
        .task-4 { background-color: #2196F3; }
        .task-5 { background-color: #9C27B0; }

        .checkbox {
            width: 20px;
            height: 20px;
            background-color: #eee;
            border-radius: 50%;
            text-align: center;
            line-height: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .checkbox.checked {
            background-color: #4CAF50;
            color: white;
        }

        @media (max-width: 480px) {
            h2 {
                font-size: 18px;
            }

            .progress-card {
                padding: 10px;
            }

            .legend {
                font-size: 9px;
            }

            .checkbox {
                width: 18px;
                height: 18px;
            }

            .stage-label {
                font-size: 10px;
                min-width: 50px;
            }

            .progress-bar {
                height: 15px;
            }

            .progress-axis {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header>
        <div class="smarts-logo">
            <img src="https://i.postimg.cc/j599G4B8/smarts-logo-removebg-preview.png" alt="SMARTS Logo">
        </div>
        <div>
            <p>ROLE: <span>GENERAL CONTRACTOR</span></p>
            <i class='bx bxs-user-circle'></i>
        </div>
    </header>

    <!-- Home Section -->
    <div class="home-section">
        <div class="container">
            <div class="left-container">
                <div class="project-details">
                    <div>
                        <label for="projectSelector" style="font-weight: bold;">Select Project:</label>
                        <select id="projectSelector" style="padding: 5px; border-radius: 5px; margin-bottom: 10px;">
                            <option disabled selected>Select a project</option>
                        </select>


                        <h2><strong>Project:</strong> <span id="projectName">---</span></h2>
                        <p><strong>Location:</strong> <span id="projectLocation">---</span></p>
                    </div>
                    <div class="b">
                        <h2><strong>Company:</strong> <span id="projectCompany">---</span></h2>
                        <p><strong>Contact:</strong> <span id="projectContact">---</span></p>
                    </div>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>MATERIAL</th>
                                <th>UNITS USED</th>
                                <th>COST PER UNIT (PHP)</th>
                                <th>TOTAL COST (PHP)</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="right-container">
                <h2 class="progress-report">PROGRESS REPORT</h2>
                <div class="progress-card">
                    <div class="legend">
                        <div class="legend-item"><div class="legend-color task-1-color"></div><span>Task 1</span></div>
                        <div class="legend-item"><div class="legend-color task-2-color"></div><span>Task 2</span></div>
                        <div class="legend-item"><div class="legend-color task-3-color"></div><span>Task 3</span></div>
                        <div class="legend-item"><div class="legend-color task-4-color"></div><span>Task 4</span></div>
                        <div class="legend-item"><div class="legend-color task-5-color"></div><span>Task 5</span></div>
                    </div>
                    <div class="progress-bar-container">
                        <!-- dynamically filled -->
                    </div>
                </div>
            </div>

        </div>

        <div class="buttons">
        <div class="buttons">
            <a href="confirmLogout">
                <button>LOGOUT</button>
            </a>
        </div>
    </div>
    </div>

    <!-- Footer -->
    <footer>
        <p><span>Designed By <span style="color: black;">SMARTS Members</span></span> <span>© Copyright 2025</span></p>
    </footer>
</body>
<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const selector = document.getElementById("projectSelector");
        const nameEl = document.getElementById("projectName");
        const locEl = document.getElementById("projectLocation");
        const compEl = document.getElementById("projectCompany");
        const contEl = document.getElementById("projectContact");
        const tbody = document.querySelector(".table-container tbody");

        let projects = [];

        try {
            const response = await fetch("/gencon/projects");
            projects = await response.json();

            if (!projects.length) {
                selector.innerHTML = `<option disabled selected>No Assigned Projects</option>`;
                return;
            }

            projects.forEach(project => {
                const option = document.createElement("option");
                option.value = project.projectId;
                option.textContent = project.projectname;
                selector.appendChild(option);
            });

            // Select the first project and load its data
            selector.value = projects[0].projectId;
            loadProjectData(projects[0].projectId);
        } catch (error) {
            console.error("Failed to load assigned projects:", error);
        }

        selector.addEventListener("change", () => {
            const projectId = selector.value;
            loadProjectData(projectId);
        });

        async function loadProjectData(projectId) {
            const selected = projects.find(p => p.projectId == projectId);
            if (!selected) return;

            // Project Info
            nameEl.textContent = selected.projectname || "---";
            locEl.textContent = selected.companyLocation || "---";
            compEl.textContent = selected.companyname || "---";
            contEl.textContent = selected.companycontact || "---";

            // Inventory Table
            const inventory = await fetch(`/gencon/inventory?projectId=${projectId}`).then(r => r.json());
            tbody.innerHTML = "";

            inventory.forEach(item => {
                const row = document.createElement("tr");
                row.innerHTML = `
            <td>${item.materialName || "—"}</td>
            <td>${item.quantityAssigned ?? 0}</td>
            <td>₱${item.materialPrice ?? 0}</td>
            <td>₱${item.totalPrice ?? 0}</td>
        `;
                tbody.appendChild(row);
            });

            // Progress Report
            const progressContainer = document.querySelector(".progress-bar-container");
            progressContainer.innerHTML = "";

            const progress = await fetch(`/gencon/progress?projectId=${projectId}`).then(r => r.json());
            progress.forEach(stage => {
                const percent = stage.totalTasks === 0 ? 0 : Math.round((stage.completedTasks / stage.totalTasks) * 100);
                const isComplete = percent === 100;

                const stageDiv = document.createElement("div");
                stageDiv.className = "stage";

                stageDiv.innerHTML = `
            <div class="checkbox ${isComplete ? "checked" : ""}">${isComplete ? "✔" : ""}</div>
            <div class="stage-label">STAGE ${stage.stageNumber}</div>
            <div class="progress-bar">
                ${[...Array(stage.totalTasks)].map((_, i) => {
                    const done = i < stage.completedTasks;
                    return `<div class="progress-segment ${done ? `task-${(i % 5) + 1}` : ""}"></div>`;
                }).join("")}
            </div>
        `;

                progressContainer.appendChild(stageDiv);
            });
        }


    });
</script>
</html>
