<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Gencon Homepage</title>
    <link rel='stylesheet' href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'>
    <link
            href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;700&family=Baloo+Chettan+2:wght@400;700&family=Numans&display=swap"
            rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Numans", sans-serif;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #EDEDED;
            color: #124D54;
            font-size: 14px;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
            z-index: 10;
            transition: all 0.5s ease;
            padding: 10px 20px;
        }

        header div {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header div i {
            font-size: 30px;
            color: #124D54;
        }

        header div p {
            margin: 0;
            font-size: 16px;
            font-weight: 500;
            color: #124D54;
            font-weight: bold;
        }

        header div p span {
            font-weight: bold;
            color: #F9744B;
        }

        header::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background-color: #F9744B;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #EDEDED;
            color: #124D54;
            font-size: 14px;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
            z-index: 10;
            transition: all 0.5s ease;
            padding-left: 20px;
            padding-right: 20px;
        }

        .sidebar.open~footer {
            left: 250px;
            width: calc(100% - 250px);
        }

        footer p {
            margin: 0;
            font-size: 14px;
            font-family: 'Numans', sans-serif;
            width: 100%;
            display: flex;
            justify-content: space-between;
        }

        footer p span {
            display: inline-block;
        }


        .smarts-logo img {
            height: 25px;
        }

        .home-section {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #EDEDED;
            text-align: center;
            background-image: url('https://i.postimg.cc/SRM5qzhm/bg-homepage.jpg');
            background-size: cover;
            background-position: center;
            transition: left 0.3s ease;
            opacity: 0.9;
        }

        .home-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }

        .home-section .text {
            display: inline-block;
            color: #11101d;
            font-size: 25px;
            font-weight: 500;
            margin: 18px;
        }

        @media (max-width: 1024px) {
            header {
                left: 0;
                width: 100%;
            }

            .sidebar {
                width: 70px;
            }

            .sidebar.open {
                width: 220px;
            }

            .home-section {
                left: 70px;
                width: calc(100% - 70px);
            }
        }

        @media (max-width: 768px) {
            header {
                font-size: 12px;
            }

            .sidebar {
                width: 60px;
            }

            .sidebar.open {
                width: 200px;
            }

            .home-section {
                left: 60px;
                width: calc(100% - 60px);
            }

            .sidebar i {
                font-size: 22px;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 10px;
                font-size: 12px;
            }

            .sidebar {
                width: 55px;
            }

            .sidebar.open {
                width: 180px;
            }

            .home-section {
                left: 55px;
                width: calc(100% - 55px);
            }

            .sidebar i {
                font-size: 20px;
            }

            .sidebar li a .links_name {
                font-size: 12px;
            }
        }

        .container {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: flex-start;
        }
        .left-container, .right-container {
            background-color: white;
            border: 3px solid #F9744B;
            border-radius: 15px;
            padding: 20px;
            width: 48%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .project-details {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            color: #124D54;
        }
        .project-details h2, .project-details p {
            margin: 5px 0;
            font-size: 14px;
        }
        select {
            padding: 5px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background-color: #F9744B;
            color: white;
            padding: 10px;
        }
        td {
            background-color: #fff4f0;
            color: #333;
            padding: 10px;
            text-align: center;
        }
        .progress-report {
            font-size: 24px;
            color: #F9744B;
            text-align: center;
            margin-bottom: 15px;
        }
        .progress-card {
            background-color: #124D54;
            border-radius: 15px;
            padding: 20px;
            color: white;
        }
        .legend {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-color {
            width: 15px;
            height: 15px;
            border-radius: 3px;
        }
        .task-1-color { background-color: #ee6842; }
        .task-2-color { background-color: #000000; }
        .task-3-color { background-color: #132c39; }
        .task-4-color { background-color: #a6a6a6; }
        .task-5-color { background-color: #f5a88d; }
        .task-6-color { background-color: #f9c74f; }
        .task-7-color { background-color: #90be6d; }
        .task-8-color { background-color: #577590; }
        .task-9-color { background-color: #f94144; }
        .task-10-color { background-color: #43aa8b; }
        .progress-bar-container .stage {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .progress-bar-container, .table-container {
            max-height: 400px;
            overflow-y: auto;
        }
        .checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #f9744b;
            border-radius: 50%;
            margin-right: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
        }
        .checkbox.checked {
            background-color: #f9744b;
            color: white;
        }
        .stage-label {
            width: 60px;
            font-size: 14px;
        }
        .progress-bar {
            flex: 1;
            height: 20px;
            display: flex;
            border-radius: 5px;
            overflow: hidden;
            background-color: #ccc;
        }
        .progress-segment {
            flex: 1;
            height: 100%;
        }
        .task-1 { background-color: #ee6842; }
        .task-2 { background-color: #000000; }
        .task-3 { background-color: #132c39; }
        .task-4 { background-color: #a6a6a6; }
        .task-5 { background-color: #f5a88d; }
        .task-6 { background-color: #f9c74f; }
        .task-7 { background-color: #90be6d; }
        .task-8 { background-color: #577590; }
        .task-9 { background-color: #f94144; }
        .task-10 { background-color: #43aa8b; }
        .buttons {
            text-align: center;
            margin-top: 20px;
        }
        .buttons button {
            padding: 10px 20px;
            background-color: #f9744b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .projectSelector {
            display: flex;
            align-items: flex-start;
            margin-bottom: 10px;
        }
    </style>

</head>

<body>
<!-- Header -->
<header>
    <div class="smarts-logo">
        <img src="https://i.postimg.cc/j599G4B8/smarts-logo-removebg-preview.png" alt="SMARTS Logo">
    </div>
    <div>
        <p>ROLE: <span>GENERAL CONTRACTOR</span></p>
        <i class='bx bxs-user-circle'></i>
    </div>
</header>

<!-- Home Section -->
<div class="home-section">
    <div class="container">
        <div class="left-container">
            <div class="projectSelector">
                <label for="projectSelector" style="font-weight: bold; margin-right: 10px; color: black;">Select Project:</label>
                <select id="projectSelector" style="width: 300px; padding: 5px; border-radius: 5px; margin-bottom: 10px;">
                    <option disabled selected>Select a project</option>
                </select>
            </div>

            <div class="project-details">
                <div>
                    <h2><strong>Project:</strong> <span id="projectName">---</span></h2>
                    <p><strong>Location:</strong> <span id="projectLocation">---</span></p>
                </div>
                <div class="b">
                    <h2><strong>Company:</strong> <span id="projectCompany">---</span></h2>
                    <p><strong>Contact:</strong> <span id="projectContact">---</span></p>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                    <tr>
                        <th>MATERIAL</th>
                        <th>UNITS USED</th>
                        <th>COST PER UNIT (PHP)</th>
                        <th>TOTAL COST (PHP)</th>
                    </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="right-container">
            <h2 class="progress-report">PROGRESS REPORT</h2>
            <div class="progress-card">
                <div class="legend">
                    <!-- TASK 1-5 -->
                    <div style="display: flex; justify-content: space-around; flex-wrap: wrap; width: 100%; margin-bottom: 10px;">
                        <div class="legend-item"><div class="legend-color task-1-color"></div><span>Task 1</span></div>
                        <div class="legend-item"><div class="legend-color task-2-color"></div><span>Task 2</span></div>
                        <div class="legend-item"><div class="legend-color task-3-color"></div><span>Task 3</span></div>
                        <div class="legend-item"><div class="legend-color task-4-color"></div><span>Task 4</span></div>
                        <div class="legend-item"><div class="legend-color task-5-color"></div><span>Task 5</span></div>
                    </div>

                    <!-- TASK 6-10 -->
                    <div style="display: flex; justify-content: space-around; flex-wrap: wrap; width: 100%;">
                        <div class="legend-item"><div class="legend-color task-6-color"></div><span>Task 6</span></div>
                        <div class="legend-item"><div class="legend-color task-7-color"></div><span>Task 7</span></div>
                        <div class="legend-item"><div class="legend-color task-8-color"></div><span>Task 8</span></div>
                        <div class="legend-item"><div class="legend-color task-9-color"></div><span>Task 9</span></div>
                        <div class="legend-item"><div class="legend-color task-10-color"></div><span>Task 10</span></div>
                    </div>
                </div>

                <div class="progress-bar-container">
                    <!-- dynamically filled -->
                </div>
            </div>
        </div>

    </div>

    <div class="buttons">
        <div class="buttons">
            <a href="confirmLogout">
                <button>LOGOUT</button>
            </a>
        </div>
    </div>
</div>

<!-- Footer -->
<footer>
    <p><span>Designed By <span style="color: black;">SMARTS Members</span></span> <span>© Copyright 2025</span></p>
</footer>
</body>
<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const selector = document.getElementById("projectSelector");
        const nameEl = document.getElementById("projectName");
        const locEl = document.getElementById("projectLocation");
        const compEl = document.getElementById("projectCompany");
        const contEl = document.getElementById("projectContact");
        const tbody = document.querySelector(".table-container tbody");

        let projects = [];

        try {
            const response = await fetch("/gencon/projects");
            projects = await response.json();

            if (!projects.length) {
                selector.innerHTML = `<option disabled selected>No Assigned Projects</option>`;
                return;
            }

            projects.forEach(project => {
                const option = document.createElement("option");
                option.value = project.projectId;
                option.textContent = project.projectname;
                selector.appendChild(option);
            });

            // Select the first project and load its data
            selector.value = projects[0].projectId;
            loadProjectData(projects[0].projectId);
        } catch (error) {
            console.error("Failed to load assigned projects:", error);
        }

        selector.addEventListener("change", () => {
            const projectId = selector.value;
            loadProjectData(projectId);
        });

        async function loadProjectData(projectId) {
            const selected = projects.find(p => p.projectId == projectId);
            if (!selected) return;

            // Project Info
            nameEl.textContent = selected.projectname || "---";
            locEl.textContent = selected.companyLocation || "---";
            compEl.textContent = selected.companyname || "---";
            contEl.textContent = selected.companycontact || "---";

            // Inventory Table
            const inventory = await fetch(`/gencon/inventory?projectId=${projectId}`).then(r => r.json());
            tbody.innerHTML = "";

            inventory.forEach(item => {
                const row = document.createElement("tr");
                row.innerHTML = `
            <td>${item.materialName || "—"}</td>
            <td>${item.quantityAssigned ?? 0}</td>
            <td>₱${item.materialPrice ?? 0}</td>
            <td>₱${item.totalPrice ?? 0}</td>
        `;
                tbody.appendChild(row);
            });

            // Progress Report
            const progressContainer = document.querySelector(".progress-bar-container");
            progressContainer.innerHTML = "";

            const progress = await fetch(`/gencon/progress?projectId=${projectId}`).then(r => r.json());
            progress.forEach(stage => {
                const percent = stage.totalTasks === 0 ? 0 : Math.round((stage.completedTasks / stage.totalTasks) * 100);
                const isComplete = percent === 100;

                const stageDiv = document.createElement("div");
                stageDiv.className = "stage";

                stageDiv.innerHTML = `
            <div class="checkbox ${isComplete ? "checked" : ""}">${isComplete ? "✔" : ""}</div>
            <div class="stage-label">STAGE ${stage.stageNumber}</div>
            <div class="progress-bar">
                ${[...Array(stage.totalTasks)].map((_, i) => {
                    const done = i < stage.completedTasks;
                    return `<div class="progress-segment ${done ? `task-${(i % 5) + 1}` : ""}"></div>`;
                }).join("")}
            </div>
        `;

                progressContainer.appendChild(stageDiv);
            });
        }


    });
</script>
</html>
